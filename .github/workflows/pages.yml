name: Deploy static playground manually
on:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.32.1
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
        env:
          VITE_BASE_PATH: /voucherguard/
          VITE_REPOSITORY_URL: https://github.com/cg1290-tech/voucherguard
          VITE_VG_TOKEN_MINT: ${{ vars.VG_TOKEN_MINT }}
          VITE_VG_RPC_URL: ${{ vars.VG_RPC_URL }}
          VITE_VG_HOLDER_THRESHOLD: ${{ vars.VG_HOLDER_THRESHOLD }}
          VITE_VG_NETWORK: ${{ vars.VG_NETWORK }}
      - uses: actions/upload-pages-artifact@v3
        with:
          path: apps/web/dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
